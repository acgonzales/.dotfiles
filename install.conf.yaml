- defaults:
    link:
      relink: true
- clean:
    ~/:
      force: false
    ~/.config:
      recursive: true
- create:
    - ~/Development
- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [chmod +x ./scripts/*.sh, Making scripts executable]
    - command: ./scripts/setup_homebrew.sh
      description: Installing Homebrew and packages
      stdin: true
      stdout: true
      stderr: true
- link:
    ~/.gitconfig:
      force: true
      path: .gitconfig
    ~/.zshrc:
      force: true
      path: .zshrc
    ~/.zprofile:
      force: true
      path: .zprofile
    ~/.p10k.zsh:
      force: true
      path: .p10k.zsh
    ~/.config/alacritty:
      create: true
      force: true
      path: .config/alacritty
